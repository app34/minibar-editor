<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Minibar</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-header">
    <div class="brand">Minibar</div>
    <div class="header-controls">
      <div class="zone-toggle">
        <button class="toggle-btn active" id="btnBeach" data-zone="Beach">Beach</button>
        <button class="toggle-btn" id="btnWater" data-zone="Water">Water</button>
      </div>
      <select id="daySelect" class="day-select" disabled title="Service date"></select>
    </div>
  </header>

  <div class="viewport" id="homeView">
    <div class="main-container">
      <div class="control-toolbar">
        <div class="search-box">
          <input id="roomFilter" type="number" inputmode="numeric" placeholder="Filter room..." />
        </div>
        <button class="btn-cool btn-danger" id="cleanBtn" type="button">Clean</button>
        <label class="btn-cool" for="fileInput">Import</label>
        <input id="fileInput" type="file" accept=".xlsx,.xlsm" hidden />
        <button class="btn-cool btn-success" id="saveBtn" type="button" disabled>Share / XL</button>
      </div>
      <button class="btn-cool btn-primary" id="finishBtn" type="button" disabled>Finish Day</button>
      <p class="file-hint" id="fileStatus">Import the month workbook to begin</p>
      <h2 class="section-title" id="zoneTitle">BEACH ZONE (0)</h2>
      <div class="villa-grid" id="villaGrid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="roomModal">
    <div class="modal-card" id="modalCard">
      <header class="modal-header">
        <div class="modal-title" id="modalTitle">Villa</div>
        <div class="header-action-group">
          <div class="view-mode-pill">
            <button class="view-pill-btn" id="sheetViewBtn" type="button">Sheet</button>
            <button class="view-pill-btn active" id="fullViewBtn" type="button">Full</button>
          </div>
          <button class="btn-action-icon" id="closeModalBtn" type="button">X</button>
        </div>
      </header>
      <div class="category-legend">
        <span class="legend-item"><i class="legend-swatch food"></i> Food</span>
        <span class="legend-item"><i class="legend-swatch soft"></i> Soft Drinks</span>
        <span class="legend-item"><i class="legend-swatch alc"></i> Alcohol</span>
        <span class="legend-item"><i class="legend-swatch snack"></i> Snacks</span>
      </div>
      <div class="modal-body" id="itemGrid"></div>
      <footer class="modal-footer">
        <button class="save-entry" id="saveEntryBtn" type="button">Save Local Entry</button>
      </footer>
    </div>
  </div>

  <div class="toast-container"><div class="toast-msg" id="toast"></div></div>
  <div class="loader hidden" id="loader"><span>Working...</span></div>

  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
